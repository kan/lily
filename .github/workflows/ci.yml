name: CI

# **利用側を 1 つも知らない状態で通ること**を見る。テストは実 workerd + 実 D1。
#
# **E2E はここに無い。** 公開 URL とフィードが変わっていないことは利用側が
# 判定する（fushihara.net の `blog/e2e/`）。lily を入れ替えてもあれがそのまま
# 通ることが、外向きの契約を守れている証拠になる。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      # **`scripts/tagpr/` の subtree と、tagpr.yml / tagpr-label.yml / publish.yml が呼ぶ共通の workflow の SHA が
      # 同じ commit を指すこと。** 片方だけ動くと、取り込んだスクリプトと実際に動く
      # workflow が黙って食い違う（CLAUDE.md「リリース PR（tagpr）の仕組み」）。
      # 依存を使わないので `npm ci` より前に置く
      - name: Check scripts/tagpr/ against the tagpr workflow pin
        run: node scripts/tagpr/verify-subtree.mjs
      - run: npm ci
      - run: npm run typecheck
      # 型検査が見ないもの（await 漏れ・floating した Promise・`any` の伝播・
      # Vue の template）。**型検査とは別の観点**なので両方回す。
      - run: npm run lint
      # **emit を型検査とは別に回す。** `typecheck` は `--noEmit` なので、
      # emit だけが壊れる状態（`rootDir` の外のファイルを import した等）を通す。
      # 配るのは emit したものなので、ここで落としておかないと publish で初めて分かる。
      #
      # **`build` ではなく `build:lib`。** 管理画面 (`build:admin`) は次の
      # `npm test` が `pretest` で作るので、`build` にすると vite が 2 回走る。
      - run: npm run build:lib
      # 実 workerd + 実 D1。`pretest` が管理画面とテスト用の静的アセットを用意する。
      - run: npm test

      # **`lily init` が作った木が、その版の lily で通ること。**
      #
      # init は `config.ts` / `wrangler.jsonc` / `package.json` の行を名指しで
      # 書き換える。見つからなければ落ちるようにしてあるが、**誰も init を
      # 回さないと publish まで気付けない。** 書けたかだけを見ても足りない ——
      # 構文として壊れた値を埋めても、型検査まで行かないと分からない。
      #
      # **配る形（`npm pack`）を入れて確かめる。** `npm install @kanf/lily` だと
      # publish 済みの版に当たるので、いま直したものを検証できない。`prepack` が
      # 走るので、雛形の `gitignore` もこの経路で作られる。
      #
      # CLAUDE.md に書いてある手作業（pack → install → build && typecheck）と
      # 同じことを、init の出力に対して回している。
      - name: lily init の出力が通ることを見る
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          node bin/lily.mjs init "$RUNNER_TEMP/init-smoke" --yes --no-install
          cd "$RUNNER_TEMP/init-smoke"
          npm install --no-audit --no-fund "$RUNNER_TEMP"/kanf-lily-*.tgz
          npm run build
          npm run typecheck

  # **雛形（`template/`）を、その `package-lock.json` のまま入れて通るか。** Deploy to Cloudflare の
  # ボタンと同じく `npm ci` で入れる。上の `test` の init の検査は手元の tgz を入れるので、
  # 雛形の lock は確かめない。雛形の lily を上げる Dependabot の PR を自動でマージする前の検査も兼ねる
  #
  # **Dependabot が雛形を上げる PR でだけ走らせる。** lock が指すのは npm に出ている版の lily なので、
  # まだ出していない lily に合わせて `template/src/` を直した PR では落ちる。リリースして lock が
  # 追いつくまで、main とその後の PR がずっと赤になる
  template-lock:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/template/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: template/package-lock.json
      - name: 雛形をその lock のまま入れて通ることを見る
        working-directory: template
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run typecheck
          npx wrangler deploy --dry-run

  # **雛形の lily を上げる Dependabot の PR を、`test` と `template-lock` が通ったら squash でマージする。**
  # Deploy to Cloudflare のボタンは main の `template/` を lock ごと使うので、マージを待つ間は
  # 前の版の lily で作られる（CLAUDE.md「リリース手順」の 5）。kan/wema-kake の同名のジョブと同じ形。
  #
  # - リポジトリの auto-merge（`gh pr merge --auto`）は使わない（リポジトリの設定で OFF）。
  #   検査のジョブを `needs` にして、このジョブの中でマージする
  # - **ruleset の required check（`test` と `Verify actions.lock`）が通るのを待ってからマージする。**
  #   `Verify actions.lock` は別の workflow なので `needs` で待てない。待たずにマージすると ruleset に
  #   断られる
  # - **このジョブでは依存のコードを走らせない**（書き込みの権限を持つため）。checkout もしない。
  #   `npm ci` は `template-lock` で行う
  # - マージするのは、`/template` の `@kanf/lily` だけを上げる PR に限る。major（1.0 へ上げる PR）は
  #   手でマージする。0.x の minor（破壊的な変更）は自動でマージする。破壊的な変更に合わせた
  #   `template/src/` はリリース PR で main に入っており、lock が追いつくまでボタンが壊れているため。
  #   変わったファイルが `template/package.json` と `template/package-lock.json` だけであることも確かめる
  # - PR の作者だけでなく、run を起こした主体も Dependabot に限る（人が同じブランチへ push したり、
  #   run を再実行したりしたときはマージしない）。再実行では `github.actor` が元の run の主体の
  #   ままなので、再実行した人を指す `github.triggering_actor` も見る
  # - 検査したコミットだけをマージする（`--match-head-commit`）。Dependabot が rebase して
  #   head が進んでいたら、マージせずに緑で抜け、新しい head の run に任せる
  # - GITHUB_TOKEN でのマージなので、main への push の run（この CI、tagpr.yml など）は起動しない。
  #   PR の run は main とのマージの結果（`refs/pull/N/merge`）を検査しているので、それで代える。
  #   この PR は CHANGELOG を書かないので、tagpr の run が走らなくても失うものは無い
  automerge-template:
    needs: [test, template-lock]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.triggering_actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # PR をマージする
      pull-requests: write  # PR をマージする
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      - name: 雛形の lily を上げる PR をマージする
        if: >-
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          steps.metadata.outputs.directory == '/template' &&
          steps.metadata.outputs.dependency-names == '@kanf/lily' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(gh pr diff "$PR" --name-only | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$files" != "template/package-lock.json template/package.json " ]; then
            echo "::error::unexpected files in the template bump: $files"
            exit 1
          fi
          gh pr checks "$PR" --required --watch --fail-fast
          if [ "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" != "$HEAD_SHA" ]; then
            echo "::notice::the head moved past $HEAD_SHA, so the run of the new head merges it"
            exit 0
          fi
          gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA"
