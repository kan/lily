name: Publish

# **タグを npm へ stage し、GitHub Release を作る。** 中身は kan/tagpr-scripts の共通の workflow
# （動き、入力、落ちたときの扱いは scripts/tagpr/README.md の「The npm publish workflow」）。
#
# - main への push で自動 publish しないのは、版を上げる判断とコードを直す判断が別だから。
#   版を上げる判断は、tagpr のリリース PR をマージすることで行う（CLAUDE.md「リリース手順」）
# - 普段は `tagpr.yml` がタグを ref にして `workflow_dispatch` で起動する（GITHUB_TOKEN で
#   push したタグでは `push: tags` が起動しないため）。`push: tags` は手でタグを打ち直したとき用
# - **npm へは `npm stage publish` で出す。** 公開されるのは、run の Job Summary にある stage ID を
#   `npm stage approve` したとき。npm の Trusted Publisher は stage publish だけを許してある
# - **ファイル名を変えない。** npm の Trusted Publisher は、呼ぶ側のこのファイル名
#   （`publish.yml`）で照合する
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# **1 つのタグに 1 run。止めない。** publish の途中で止めると、npm には出たのに Release が
# 無い版が残る。共通の workflow は `concurrency` を持たないので、ここに置いても deadlock しない
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    # **SHA は `scripts/tagpr/` に取り込んだ tagpr-scripts の commit にする。** tagpr.yml の
    # 呼ぶ行と同じ。食い違いは ci.yml の `verify-subtree.mjs` が落とす
    uses: kan/tagpr-scripts/.github/workflows/publish-npm.yml@3fb536bb107b6b08940ee49f0a8d5a69e68df211
    permissions:
      contents: write  # checkout と GitHub Release
      id-token: write  # npm の Trusted Publishing
    with:
      check: npm run typecheck && npm test
      # tgz は `npm pack` の `prepack`（`npm run build`）が dist/lib と dist/admin を作って詰める
      access: public
