name: Publish

# **タグを打ったときだけ npm へ出す。** main への push で自動 publish しないのは、
# 版を上げる判断とコードを直す判断が別だから。版を上げる判断は、tagpr の
# リリース PR をマージすることで行う（CLAUDE.md「リリース手順」）。
#
# 普段は `tagpr.yml` がタグを ref にして `workflow_dispatch` で起動する
# （GITHUB_TOKEN で push したタグでは `push: tags` が起動しないため）。
# `push: tags` は手でタグを打ち直したとき用。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# **1 つのタグに 1 run。止めない。** publish の途中で止めると、npm には出たのに
# Release が無い、が残る。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # **GitHub Release を作るのに要る。** タグだけだと「何が変わったか」がリポジトリの
  # 側に残らず、npm のページから戻ってくる先も無い。
  contents: write
  # **Trusted Publishing (OIDC)。** token を secret に置かない代わりに、npm 側で
  # 「このリポジトリのこのワークフローからの publish を許す」と登録しておく。
  # provenance（どのリポジトリのどのワークフローが出したか）も自動で付く。
  # 同じスコープの @kanf/wema がこの形。
  #
  # npm 側の Trusted Publisher は **direct publish を許可しておくこと。**
  # 既定は「npm stage publish」だけで、そのままだと `npm publish` が
  # `403 OIDC permission denied` で落ちる（issue #5 で踏んだ）。
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # 次の 2 つの検査は Node の組み込みしか使わないので、npm の準備より先に置く
      # （手で打ったタグが誤っていたとき、依存の取得を待たずに落ちる）。
      #
      # **タグと `package.json` の版が一致すること。**
      # ずれたまま出すと、`v0.1.1` のタグで 0.1.0 が publish されて（あるいは
      # 「同じ版は出せない」で落ちて）、どちらも原因がタグ名から読めない。
      - name: タグと版の一致を見る
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "タグ ($TAG) と package.json の版 ($version) が違う" >&2
            exit 1
          fi

      # **Release の本文は CHANGELOG の節。** 節が無ければ、npm へ出す前に止める
      # （出した後に止まると、npm にはあるのに Release が無い版ができる）。
      # リリース PR を通っていれば節はあるので、拾うのは手で打ったタグのとき。
      # 出したものをそのまま Release の本文に使う（検査したもの = 本文）。
      - name: CHANGELOG の節を取り出す
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"

      # Trusted Publishing は npm 11.5.1 以降にしか無い。
      - run: npm install -g npm@latest
      - run: npm ci

      # publish の前に一通り通す。**`prepack` が `npm run build` を呼ぶ**ので、
      # 配るもの (dist/lib + dist/admin) はここで作られる。
      - run: npm run typecheck
      - run: npm test

      - run: npm publish --access public

      # **npm に出たものは GitHub にも残す。** タグだけだと、何が変わったかを
      # 読む場所が commit ログしかなく、npm のページから戻ってくる先も無い。
      #
      # **npm publish の後に置く。** 逆にすると、publish が落ちた版の release が
      # 残り、「GitHub にはあるのに npm に無い」が成立する。
      #
      # `--verify-tag` はタグが実在することを確かめる。本文は CHANGELOG のその版の
      # 節（上で確かめてある）。commit の羅列（`--generate-notes`）にしないのは、
      # 利用者に届く変更と依存の更新が同じ重さで並ぶため。
      #
      # **ref がタグのときだけ作る。** `workflow_dispatch` を main で起動すると
      # 上の版の一致で落ちるが、念のためここでも止める。
      - name: GitHub Release を作る
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md"
