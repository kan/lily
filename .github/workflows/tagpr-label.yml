name: tagpr-label

# **リリース PR のラベル（`tagpr:minor` など）を付け外ししたら、リリース PR を作り直す。**
# リリース PR を draft にし、`tagpr.yml` をリリース PR のブランチで `workflow_dispatch` する。
# 作り直さずにマージすると、ラベルの版ではなく前の版が出る（CLAUDE.md「リリース手順」）。
#
# 中身は kan/tagpr-scripts の共通の workflow。動きは tagpr-scripts の README の
# 「The tagpr workflow」。何も checkout しないので、`pull_request_target` でも PR のコードは
# 走らない
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions: {}

jobs:
  rebuild:
    # **SHA は `scripts/tagpr/` に取り込んだ tagpr-scripts の commit にする。** tagpr.yml の
    # 呼ぶ行と同じ。食い違いは ci.yml の `verify-subtree.mjs` が落とす
    uses: kan/tagpr-scripts/.github/workflows/tagpr-label.yml@231fe768bce55eb24fed1e10a4b27907ebf7a306
    permissions:
      actions: write        # tagpr.yml を workflow_dispatch する
      pull-requests: write  # リリース PR を draft にする
