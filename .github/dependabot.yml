version: 2

# PR は `workflows/ci.yml` の pull_request トリガーが拾う（typecheck + emit +
# 実 workerd の test）ので、壊れる更新はマージ前に落ちる。

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7.0 はネイティブ (Go) 実装で typescript/lib/tsc を公開しない
      # ため、それを require する vue-tsc (Volar) が起動できず、typecheck が
      # ERR_PACKAGE_PATH_NOT_EXPORTED で落ちる。Volar が使えるプログラマティック
      # API は TS 7.1 で安定予定なので、7.0.x だけを無視して 7.1 の PR は
      # 受け取る (可否は CI が判定する)。
      - dependency-name: typescript
        versions: ['7.0.x']
      # vitest 5 は @cloudflare/vitest-plugin の peer (vitest@^4.1.0) と衝突し、
      # npm ci が ERESOLVE で落ちる。テストは plugin の workerd プールで動いて
      # いるので、plugin を捨てて vitest だけ上げる選択肢は無い。
      - dependency-name: vitest
        versions: ['5.x']
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps

  # **template の lily を、出したばかりの版に上げる PR を作る**（issue #42）。Deploy to
  # Cloudflare のボタンは template/package-lock.json で `npm ci` するので、上げ忘れると
  # ボタンから入る人が古い lily で始まる。リリース PR に入れられないのは、準備の時点では
  # その版が npm に無いため。Dependabot は registry に版が見えてから PR を作る。
  - package-ecosystem: npm
    directory: /template
    schedule:
      interval: daily
      time: '09:00'
      timezone: Asia/Tokyo
    # **範囲も動かす。** `^0.5.0` は `0.6.0` を受けないので、lock だけ上げると minor を
    # 上げたときに 1 つ古いまま残る
    versioning-strategy: increase
    # version update は既定で公開から 3 日待つ。lily は自分で出した版なので待たない
    cooldown:
      exclude:
        - '@kanf/lily'
    # **version update は lily だけ。** `allow` で絞ると security update まで止まるので、
    # ほかは `update-types` 付きの `ignore` で止める。`update-types` だけの ignore は
    # security update では何も除外しない（dependabot-core の IgnoreCondition）。
    # template に依存を足したら、ここにも足す
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: wrangler
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
    # CHANGELOG には書かない（CLAUDE.md「PR 運用」）。依存の更新 (`deps`) と分けて見えるように
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    ignore:
      # tagpr.yml / tagpr-label.yml / publish.yml が呼ぶ kan/tagpr-scripts の共通の workflow の SHA は、
      # scripts/tagpr/ の subtree と揃える。subtree pull と同じ PR でだけ上げ、
      # Dependabot には上げさせない (tagpr-scripts の README「The tagpr workflow」)。
      # 今はタグが無いので上げに来ないが、タグを打つと SHA だけ上げる PR が来る。
      - dependency-name: 'kan/tagpr-scripts*'
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
